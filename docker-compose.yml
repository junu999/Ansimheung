# 로컬 개발용 PostgreSQL + PostGIS
# 실행: docker compose up -d    종료: docker compose down    데이터까지 삭제: docker compose down -v
services:
  db:
    image: postgis/postgis:16-3.4
    # 공식 PostGIS 이미지는 Intel(amd64)용만 있어서 M칩 맥에서는 Docker가 변환(Rosetta)해서 실행해요.
    # CI와 똑같은 이미지를 쓰려고 명시해 둔 것이라, 동작에는 문제없고 조금 느릴 뿐이에요.
    platform: linux/amd64
    container_name: ansimheung-db
    environment:
      POSTGRES_DB: ansimheung
      POSTGRES_USER: ansimheung
      POSTGRES_PASSWORD: ansimheung   # 로컬 전용 값. 배포 서버에서는 절대 쓰지 말 것
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d/zz-ansimheung
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansimheung -d ansimheung"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
