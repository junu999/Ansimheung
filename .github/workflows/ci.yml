name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ansimheung
          POSTGRES_USER: ansimheung
          POSTGRES_PASSWORD: ansimheung
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ansimheung -d ansimheung"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        run: ./gradlew build
