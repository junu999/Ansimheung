<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17765b">
  <meta name="description" content="시민의 작은 제보로 함께 만드는 안심 통학길. 정왕초 주변 위험 요소를 살펴보고 통학경로를 비교해 보세요.">
  <title>안심흥 · 함께 만드는 안심 통학길</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <a class="skip-link" href="#panel">본문으로 건너뛰기</a>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="m9 5-6-2v16l6 2 6-2 6 2V5l-6-2zM9 5v16m6-18v16"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v6a3 3 0 0 0 3 3h6a3 3 0 0 0 0-6h-3M18 3v4m-2-2h4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="m5 7 2-4h10l2 4 2 3v8H3v-8Zm-2 4h18M6 18v3m12-3v3"/><path d="M6 14h2m8 0h2"/></symbol>
      <symbol id="i-light" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-4 10.5V17h8v-3.5A6 6 0 0 0 12 3ZM9 21h6M9 17h6"/></symbol>
      <symbol id="i-construction" viewBox="0 0 24 24"><path d="m12 3 10 18H2Z"/><path d="M12 9v5m0 3h.01"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="14" cy="4" r="2"/><path d="m7 22 3-7-1-5 4-3 3 4 4 1M5 13l4-3m1 5 5 2 2 5m-5-14-2 7"/></symbol>
      <symbol id="i-speed" viewBox="0 0 24 24"><path d="M4 19a10 10 0 1 1 16 0ZM12 14l5-6M5 12h2m10 0h2M12 4v2"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></symbol>
      <symbol id="i-school" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11H3ZM9 21v-6h6v6M7 11h.01M17 11h.01"/><path d="M12 3V1l5 1-5 1"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 10 6-10 6L2 9Zm-9 11 9 5 9-5M3 18l9 5 9-5"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-11v.01"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 6h4l2-3h6l2 3h4v15H3Z"/><circle cx="12" cy="13" r="4"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M3 16v5h18v-5"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8-10-8-10-8Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V3c5-4 9 4 14 0v12c-5 4-9-4-14 0"/></symbol>
    </defs>
  </svg>
  <header class="app-header">
    <a href="#map" class="brand" aria-label="안심흥 위험지도"><span class="brand-symbol"><svg class="icon"><use href="#i-shield"/></svg></span><span>안심흥<span class="brand-tagline">함께 만드는 안심 통학길</span></span></a>
    <nav class="main-nav" aria-label="주요 메뉴">
      <button type="button" data-action="nav-map" class="nav-button active"><svg class="icon"><use href="#i-map"/></svg>위험지도</button>
      <button type="button" data-action="nav-routes" class="nav-button"><svg class="icon"><use href="#i-route"/></svg>통학경로</button>
      <button type="button" data-action="nav-guide" class="nav-button">이용안내</button>
    </nav>
    <div id="header-actions" class="header-actions"></div>
  </header>
  <main class="app-layout">
    <aside id="panel" class="side-panel" aria-label="위험지도와 제보" tabindex="-1"><div class="loading-state"><span class="spinner"></span>우리 동네 지도를 준비하고 있어요.</div></aside>
    <section class="map-section" aria-label="정왕초 주변 지도">
      <div id="map" aria-label="학교 주변 위험 제보 지도"></div>
      <div class="map-topbar">
        <div class="area-label"><span class="status-dot"></span><strong id="area-school"></strong><span class="area-divider"></span><span id="area-radius"></span><span class="pilot-tag">시범지역</span></div>
        <div class="map-layer-buttons">
          <button class="map-layer-button" data-action="toggle-zones" aria-pressed="false" title="위험 범위 표시"><svg class="icon"><use href="#i-layers"/></svg><span>위험 범위</span></button>
          <button class="map-layer-button" data-action="toggle-public" aria-pressed="false" title="공공데이터 표시 (불법주정차 단속 CCTV·어린이보호구역)"><svg class="icon"><use href="#i-camera"/></svg><span>공공데이터</span></button>
        </div>
      </div>
      <div id="map-selection" class="map-selection" role="status" hidden></div>
      <div id="report-crosshair" class="report-crosshair" aria-hidden="true" hidden><span></span></div>
      <div id="map-error" class="map-error" hidden><svg class="icon"><use href="#i-map"/></svg><div><strong>지도 배경을 불러오지 못했어요</strong><span>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</span></div><button data-action="retry-tiles">다시 시도</button></div>
      <div class="map-controls" aria-label="지도 조작">
        <button data-action="school-center" class="map-control standalone" title="학교 중심으로 보기" aria-label="학교 중심으로 보기"><svg class="icon"><use href="#i-school"/></svg></button>
        <div class="zoom-controls"><button data-action="zoom-in" class="map-control" title="지도 확대" aria-label="지도 확대"><svg class="icon"><use href="#i-plus"/></svg></button><button data-action="zoom-out" class="map-control" title="지도 축소" aria-label="지도 축소"><svg class="icon"><use href="#i-minus"/></svg></button></div>
        <button data-action="my-location" class="map-control standalone" title="내 위치 표시 (다시 누르면 끔)" aria-label="내 위치 표시" aria-pressed="false"><svg class="icon"><use href="#i-target"/></svg></button>
      </div>
      <div class="map-legend"><span><i class="legend-dot high"></i>위험 높음</span><span><i class="legend-dot medium"></i>위험 보통</span><span><i class="legend-dot resolved"></i>처리완료</span></div>
      <div id="route-legend" class="route-legend" hidden></div>
      <div class="demo-map-label" hidden><span class="demo-badge">DEMO</span>가짜 데이터(mock) 모드예요</div>
    </section>
  </main>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><div class="noscript">안심흥을 이용하려면 브라우저의 JavaScript를 켜 주세요.</div></noscript>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
