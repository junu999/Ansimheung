<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안심흥</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100%; }
    #status {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;
      background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="status">서버 연결 확인 중…</div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 지도 확인 (TODO 신일초 정문 좌표로 교체)
    const map = L.map('map').setView([37.38, 126.80], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 서버 · DB · PostGIS 확인
    const status = document.getElementById('status');
    fetch('/api/health')
      .then(res => res.json())
      .then(data => {
        status.textContent = data.postgis
          ? `✅ 서버 · DB · PostGIS ${data.postgis} 연결 완료`
          : `⚠️ 서버는 켜졌지만 DB 연결 실패: ${data.database}`;
      })
      .catch(() => { status.textContent = '❌ 서버에 연결할 수 없습니다'; });
  </script>
</body>
</html>
